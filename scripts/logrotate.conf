# Uncle Carl — log rotation. Versioned here, installed by
# scripts/install-logrotate.sh (which substitutes __ROOT__ and registers the
# daily cron entry). Before 2026-08-14 this file existed ONLY on prod at
# ~/.config/logrotate/trading-bot.conf — unversioned, unreviewable, and
# impossible to reproduce on a new host.
#
# `dateext` is the whole point of this file. Without it logrotate names
# rotations bot.log.1.gz … bot.log.7.gz where `.1` is the NEWEST — the exact
# reverse of chronological order, while shell globs expand in NUMERIC order.
# So the obvious command
#     zcat logs/bot.log.*.gz | grep X | tail
# reads the OLDEST archive last and reports week-old lines as the most recent.
# That misread caused a false "Telegram has been silent for 6 days" report on
# 2026-08-14 (it had in fact delivered a digest every single day). With
# dateext the names are bot.log-20260813.gz and glob order == time order, so
# the obvious command is also the correct one.
#
# Prefer scripts/logs.sh over raw globbing regardless: it orders by mtime and
# is therefore correct for BOTH the legacy .N.gz names and the dated ones.
__ROOT__/logs/*.log {
  daily
  rotate 14
  compress
  missingok
  notifempty
  # copytruncate: the bot holds its stdout fd open for the process lifetime;
  # a plain rename would leave it writing into the rotated inode until the
  # next restart. Truncating in place keeps the live fd valid.
  copytruncate
  maxsize 10M
  dateext
  dateformat -%Y%m%d
}
